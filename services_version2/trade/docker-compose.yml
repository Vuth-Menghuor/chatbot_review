version: "3.8"

services:
  trade-service:
    build: .
    container_name: trade-service
    env_file:
      - .env
    ports:
      - "8004:8004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gdce-network
    restart: unless-stopped

networks:
  gdce-network:
    external: true
