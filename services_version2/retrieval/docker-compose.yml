services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis-retrieval:
    image: redis:7-alpine
    container_name: redis-retrieval
    ports:
      - "6381:6379"
    volumes:
      - redis_retrieval_data:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  retrieval-service:
    build: .
    container_name: retrieval-service
    env_file:
      - .env
    ports:
      - "8003:8003"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
    external: true
    name: retrieval_version2_qdrant_data
  redis_retrieval_data:
    driver: local