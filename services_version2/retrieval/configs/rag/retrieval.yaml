# configs/rag/retrieval.yaml

retrieval:
  mode: hybrid # hybrid | vector_only | keyword_only

  vector:
    provider: qdrant
    top_k: 20

  keyword:
    provider: opensearch
    top_k: 20
    fields:
      - title
      - section_title
      - text
      - hs_code
      - doc_number

  merge:
    deduplicate_by:
      - chunk_id
    max_candidates: 40

  rerank:
    enabled: true
    model: bge-reranker-large
    top_n: 8

  final:
    top_k: 8 # returned to LLM
    min_text_length: 80

filters:
  enabled: true
  fields:
    - document_type
    - jurisdiction
    - language
    - effective_start_date
    - effective_end_date
    - tenant_id
    - acl_principal

effective_date_policy:
  use_chunk_level_dates_if_present: true
  fallback_to_doc_level_dates: true
  choose_latest_effective_version: true

special_cases:
  hs_code_queries:
    force_keyword_boost: true
    keyword_weight: 1.5
  legal_references:
    force_keyword_boost: true
    keyword_weight: 1.2

logging:
  record_candidates: true
  record_scores: true
