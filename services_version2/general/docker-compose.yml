version: "3.8"

services:
  qdrant-general:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-general
    ports:
      - "6334:6333"
    volumes:
      - qdrant_general_data:/qdrant/storage
    networks:
      - gdce-network
    restart: unless-stopped

  redis-general:
    image: redis:7-alpine
    container_name: redis-general
    ports:
      - "6382:6379"
    volumes:
      - redis_general_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - gdce-network
    restart: unless-stopped

  general-service:
    build: .
    container_name: general-service
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant-general
      - QDRANT_PORT=6333
      - REDIS_HOST=redis-general
      - REDIS_PORT=6379
    ports:
      - "8005:8005"
    depends_on:
      - qdrant-general
      - redis-general
    networks:
      - gdce-network
    restart: unless-stopped

volumes:
  qdrant_general_data:
  redis_general_data:

networks:
  gdce-network:
    external: true
