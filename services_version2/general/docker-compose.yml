version: '3.8'

services:
  qdrant-general:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-general
    ports:
      # Host port 6334 -> container's internal Qdrant port 6333.
      # This is a SEPARATE instance from the HS-code retrieval service's
      # qdrant container (which uses host port 6333).
      - "6334:6333"
    volumes:
      - qdrant_general_data:/qdrant/storage
    restart: unless-stopped

  general-service:
    build: .
    container_name: general-service
    env_file:
      - .env
    environment:
      # Inside the Docker network, talk to the qdrant-general container by
      # its service name on Qdrant's internal default port (6333) — NOT the
      # host-mapped 6334. The 6334 mapping above is only for host/local access.
      - QDRANT_HOST=qdrant-general
      - QDRANT_PORT=6333
    ports:
      - "8005:8005"
    depends_on:
      - qdrant-general
    restart: unless-stopped

volumes:
  qdrant_general_data:
    # Removed 'external: true' and 'name' - Docker will create this automatically

networks:
  gdce-network:
    name: gdce-network
    driver: bridge