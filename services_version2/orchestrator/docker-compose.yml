version: '3.8'

services:
  orchestrator-service:
    build: .
    container_name: orchestrator-service
    env_file:
      - .env
    environment:
      - ORCHESTRATOR_HOST=0.0.0.0
      - ORCHESTRATOR_PORT=8001
      - RETRIEVAL_SERVICE_URL=http://host.docker.internal:8003
      - CALCULATOR_SERVICE_URL=http://host.docker.internal:8002
      - TRADE_DATA_SERVICE_URL=http://host.docker.internal:8004
      - GENERAL_SERVICE_URL=http://host.docker.internal:8005
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
