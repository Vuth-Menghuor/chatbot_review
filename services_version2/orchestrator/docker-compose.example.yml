version: "3.8"

services:
  # Orchestrator Service v2
  orchestrator:
    build:
      context: ./services_version2/orchestrator
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8001
      ORCHESTRATOR_WORKERS: 4
      LOG_LEVEL: INFO

      # Service URLs (internal Docker network)
      RETRIEVAL_SERVICE_URL: http://retrieval:8000
      CALCULATOR_SERVICE_URL: http://calculator:8002
      TRADE_DATA_SERVICE_URL: http://trade_data:8004

      # Vector Search
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_SEARCH_COLLECTION: rag_documents

      # OpenSearch
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200

      # LLM
      VLLM_HOST: vllm
      VLLM_PORT: 8000
      OLLAMA_HOST: http://ollama:11434

      # Security
      RATE_LIMIT_REQUESTS: 100
      MAX_PAYLOAD_SIZE_MB: 10
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000,http://localhost:8001

    depends_on:
      - retrieval
      - calculator
      - qdrant
      - opensearch

    networks:
      - gdce-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped

  # Retrieval Service (example - adjust as needed)
  retrieval:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./services/retrieval:/app
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
    command: python main.py
    networks:
      - gdce-network
    restart: unless-stopped

  # Calculator Service (example - adjust as needed)
  calculator:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./services/calculator:/app
    ports:
      - "8002:8002"
    environment:
      PYTHONUNBUFFERED: 1
    command: python main.py
    networks:
      - gdce-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_api_key}
    networks:
      - gdce-network
    restart: unless-stopped

  # OpenSearch
  opensearch:
    image: opensearchproject/opensearch:latest
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1
      - cluster.initial_master_nodes=opensearch-node1
      - DISABLE_SECURITY_PLUGIN=true
      - "JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - gdce-network
    restart: unless-stopped

  # vLLM (optional - for LLM inference)
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache
    environment:
      - VLLM_NPROC_PER_NODE=1
    command: >
      --model meta-llama/Llama-2-7b-hf
      --host 0.0.0.0
      --port 8000
    networks:
      - gdce-network
    restart: unless-stopped
    profiles:
      - with-vllm

  # Postgres (if needed for trade data)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: trade_data
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gdce-network
    restart: unless-stopped
    profiles:
      - with-postgres

volumes:
  qdrant_data:
  opensearch_data:
  postgres_data:
  model_cache:

networks:
  gdce-network:
    driver: bridge

# Usage:
#
# 1. Start all basic services:
#    docker-compose up -d
#
# 2. Start with optional services:
#    docker-compose --profile with-postgres --profile with-vllm up -d
#
# 3. View logs:
#    docker-compose logs -f orchestrator
#
# 4. Check health:
#    curl http://localhost:8001/health
#
# 5. Stop services:
#    docker-compose down
#
# 6. Remove volumes:
#    docker-compose down -v
