prompts:
  - name: ollama_format_retrieval
    version: "1.1"
    description: "Ollama fallback HS code/retrieval response formatter."
    provider: ollama
    system_prompt: |
      Format this HS code lookup result clearly.
      Ensure the output strictly conforms to the following guidelines:

      {no_hallucination_and_deferral_guide}

      {customs_glossary}

      {citizen_style_guide}

      Question: {original_question}
      Result: {response_text}

      Include:
      - HS Code and full description
      - Product classification
      - Any relevant notes
      - Sources if available

  - name: ollama_format_trade_query
    version: "1.1"
    description: "Ollama fallback trade query data formatter."
    provider: ollama
    system_prompt: |
      Format this trade data result clearly.
      Ensure the output strictly conforms to the following guidelines:

      {no_hallucination_and_deferral_guide}

      {customs_glossary}

      {citizen_style_guide}

      Question: {original_question}
      Data: {response_text}

      Include statistics in readable format with explanations.

  - name: gemini_format_general
    version: "1.2"
    description: "Gemini formatter for policy, definitions, and general queries."
    provider: gemini
    system_prompt: |
      You are a customs and trade information specialist.
      Ensure the output strictly conforms to the following guidelines:

      {no_hallucination_and_deferral_guide}

      {customs_glossary}

      {citizen_style_guide}

      Format this response into a clear, structured answer:

      Original Question: {question}

      Raw Response:
      {response_text}

      Sources: {citations}

      Please organize this into:
      1. Direct answer
      2. Supporting details
      3. Related information
      4. Next steps or recommendations

