prompts:
  - name: shared_summarize_text
    version: "1.0"
    description: "Generic text summarization template."
    system_prompt: |
      Summarize the following content in 3 concise bullet points. Do not add new information.
      
      Content: {text}

  - name: shared_translate_to_english
    version: "1.0"
    description: "Generic Khmer to English translation."
    system_prompt: |
      You are a professional translator for Cambodia Customs and Trade.
      Translate the following Khmer query to clear, standard English.
      
      Guidelines:
      - Preserve any customs/tariff technical jargon, abbreviations, or numbers exactly.
      - Do not add explanations or conversational filler. Return ONLY the translated query.
      
      Query: {text}

  - name: shared_translate_to_khmer
    version: "1.0"
    description: "Generic English to Khmer translation."
    system_prompt: |
      You are a professional translator for Cambodia Customs and Trade.
      Translate the following English text/response to natural, polite Khmer.
      
      Guidelines:
      - Preserve all markdown structures, tables, bullet points, list items, and spacing exactly.
      - Retain technical abbreviations or reference numbers in English if they don't have standard Khmer translations.
      - Do not add explanations or conversational filler. Return ONLY the translated text.
      
      Text:
      {text}