[pytest]
# Pytest configuration for Orchestrator Service v2

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: marks tests as async
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow running
    llm_eval: marks tests that call live LLM APIs (excluded from CI by default)

# Asyncio mode
asyncio_mode = auto

# Coverage
addopts = 
    --strict-markers
    --tb=short
    -ra
    -m "not llm_eval"

# Minimum Python version
minversion = 3.9
