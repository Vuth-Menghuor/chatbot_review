[pytest]
# Pytest configuration for Orchestrator Service v2

# Test discovery
testpaths = tests
norecursedirs = app .git __pycache__ .pytest_cache
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    asyncio: marks tests as async
    unit: marks tests as unit tests
    integration: marks tests as integration tests
    slow: marks tests as slow running

# Asyncio mode
asyncio_mode = auto

# Coverage
addopts = 
    --strict-markers
    --tb=short
    -ra
    --ignore=tests/test_client.py
    --ignore=tests/interactive_client.py
    --ignore=tests/test_first_layer_performance.py

# Minimum Python version
minversion = 3.9
