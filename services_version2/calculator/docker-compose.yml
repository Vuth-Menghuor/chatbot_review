  version: "3.8"

  services:
    calculator:
      build: .
      container_name: calculator
      restart: unless-stopped
      ports:
        - "8002:8002"
      env_file:
        - .env
      environment:
        CALCULATOR_HOST: 0.0.0.0
        CALCULATOR_PORT: 8002
        PYTHONPATH: /app/services_version2
      networks:
        - gdce-network

  networks:
    gdce-network:
      external: true