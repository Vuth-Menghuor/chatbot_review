name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests per service to avoid cross-test plugin collisions
        run: |
          set -e
          # Run tests for core services individually to avoid duplicate pytest plugins
          PYTEST_TARGETS=(
            "services_version2/calculator_version2/tests"
            "services_version2/orchestrator_version2/tests"
            "services_version2/retrieval_version2/tests"
            "services_version2/trade_query_version2/tests"
          )
          for t in "${PYTEST_TARGETS[@]}"; do
            if [ -d "$t" ]; then
              echo "Running pytest for $t"
              pytest "$t" -q || exit 1
            fi
          done
