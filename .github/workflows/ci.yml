name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GEMINI_API_KEY: ci-test-key
  JWT_SECRET_KEY: ci-test-secret
  DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
  DAL_API_KEY: ci-dal-key
  REDIS_URL: redis://localhost:6379/0
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: .

jobs:
  api-layer:
    name: API Layer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/api-layer/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest

  orchestrator:
    name: Orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: services_version2/orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services_version2/orchestrator/requirements.txt
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -m "not integration"

  trade:
    name: Trade
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services_version2/trade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services_version2/trade/requirements.txt
      - name: Install dependencies
        run: pip install pytest && pip install -r requirements.txt
      - name: Run tests
        run: pytest tests -m "not integration"

  calculator:
    name: Calculator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/services_version2
    defaults:
      run:
        working-directory: services_version2/calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services_version2/calculator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke import
        run: python -c "import importlib; m=importlib.import_module('calculator.app'); assert m.create_app() is not None"

  general:
    name: General
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services_version2/general
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services_version2/general/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke import
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; assert app is not None"

  retrieval:
    name: Retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services_version2/retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services_version2/retrieval/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke import
        run: python -c "from app.app import app; assert app is not None"

  dal:
    name: DAL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/dal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data/dal/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -m "not integration"

  image-worker:
    name: Image Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: image-worker/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke import
        run: python -c "import worker; assert callable(worker.main)"

  docker-publish:
    name: Docker / ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - api-layer
      - orchestrator
      - trade
      - calculator
      - general
      - retrieval
      - dal
      - image-worker
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-layer
            context: backend/api-layer
          - image: orchestrator
            context: services_version2/orchestrator
          - image: trade
            context: services_version2/trade
          - image: calculator
            context: services_version2/calculator
          - image: general
            context: services_version2/general
          - image: retrieval
            context: services_version2/retrieval
          - image: dal
            context: data/dal
          - image: image-worker
            context: image-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatbot_review-${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/chatbot_review-${{ matrix.image }}:sha-${{ github.sha }}

  promote-dev:
    name: Promote to dev
    runs-on: ubuntu-latest
    needs:
      - api-layer
      - orchestrator
      - trade
      - calculator
      - general
      - retrieval
      - dal
      - image-worker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push verified commit to dev branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "${GITHUB_SHA}:refs/heads/dev"
