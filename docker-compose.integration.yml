# Local integration stack for frontend/backend API testing.
# This file intentionally keeps service-team application code and compose files
# untouched. Use it from the repository root.

services:
  qdrant-retrieval:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-retrieval
    ports:
      - "6333:6333"
    volumes:
      - retrieval_qdrant_data:/qdrant/storage
    networks:
      - gdce-network
    restart: unless-stopped

  redis-retrieval:
    image: redis:7-alpine
    container_name: redis-retrieval
    ports:
      - "6381:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - gdce-network
    restart: unless-stopped

  retrieval:
    build:
      context: ./services_version2/retrieval
    container_name: retrieval
    env_file:
      - path: ./services_version2/retrieval/.env
        required: false
    environment:
      RETRIEVAL_HOST: 0.0.0.0
      RETRIEVAL_PORT: 8003
      QDRANT_HOST: qdrant-retrieval
      QDRANT_PORT: 6333
      REDIS_HOST: redis-retrieval
      REDIS_PORT: 6379
    ports:
      - "8003:8003"
    depends_on:
      - qdrant-retrieval
      - redis-retrieval
    networks:
      - gdce-network
    restart: unless-stopped

  qdrant-general:
    image: qdrant/qdrant:v1.17.0
    container_name: qdrant-general
    ports:
      - "6334:6333"
    volumes:
      - general_qdrant_data:/qdrant/storage
    networks:
      - gdce-network
    restart: unless-stopped

  redis-general:
    image: redis:7-alpine
    container_name: redis-general
    ports:
      - "6382:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - gdce-network
    restart: unless-stopped

  general:
    build:
      context: ./services_version2/general
    container_name: general
    env_file:
      - path: ./services_version2/general/.env
        required: false
    environment:
      GENERAL_HOST: 0.0.0.0
      GENERAL_PORT: 8005
      QDRANT_HOST: qdrant-general
      QDRANT_PORT: 6333
      REDIS_HOST: redis-general
      REDIS_PORT: 6379
    ports:
      - "8005:8005"
    depends_on:
      - qdrant-general
      - redis-general
    networks:
      - gdce-network
    restart: unless-stopped

  calculator-postgres:
    image: postgres:18-alpine
    container_name: calculator-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - calculator_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gdce-network
    restart: unless-stopped

  calculator-db-restore:
    image: postgres:18-alpine
    container_name: calculator-db-restore
    depends_on:
      calculator-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./gdce_postgre_db/dump-gdce_calculator-202607031116.sql:/dump/gdce_calculator.dump:ro
    command:
      - sh
      - -lc
      - >
        psql -h calculator-postgres -U postgres -d postgres -tc "SELECT 1 FROM pg_roles WHERE rolname='calc_app'" | grep -q 1
        || psql -h calculator-postgres -U postgres -d postgres -c "CREATE ROLE calc_app LOGIN PASSWORD 'calc_app_password';";
        pg_restore -h calculator-postgres -U postgres -d postgres --clean --if-exists --create /dump/gdce_calculator.dump
    networks:
      - gdce-network
    restart: "no"

  calculator-redis:
    image: redis:7-alpine
    container_name: gdce-redis
    ports:
      - "6379:6379"
    networks:
      - gdce-network
    restart: unless-stopped

  calculator:
    build:
      context: ./services_version2/calculator
    container_name: calculator
    env_file:
      - ./services_version2/calculator/.env
    environment:
      CALCULATOR_HOST: 0.0.0.0
      CALCULATOR_PORT: 8002
      PYTHONPATH: /app
      CALCULATOR_DB_HOST: calculator-postgres
      CALCULATOR_DB_PORT: 5432
      CALCULATOR_DB_NAME: gdce_calculator
      CALCULATOR_DB_USER: calc_app
      CALCULATOR_DB_PASSWORD: calc_app_password
      POSTGRES_HOST: calculator-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: gdce_calculator
      POSTGRES_USER: calc_app
      POSTGRES_PASSWORD: calc_app_password
      PG_HOST: calculator-postgres
      PG_PORT: 5432
      PG_DATABASE: gdce_calculator
      PG_USER: calc_app
      PG_PASSWORD: calc_app_password
      REDIS_HOST: calculator-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      QDRANT_HOST: qdrant-retrieval
      QDRANT_PORT: 6333
    ports:
      - "8002:8002"
    depends_on:
      calculator-db-restore:
        condition: service_completed_successfully
      calculator-redis:
        condition: service_started
    networks:
      - gdce-network
    restart: unless-stopped

  trade-redis:
    image: redis:7-alpine
    container_name: trade-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gdce-network
    restart: unless-stopped

  trade-service:
    build:
      context: ./services_version2/trade
    container_name: trade-service
    env_file:
      - ./services_version2/trade/.env
    environment:
      TZ: Asia/Phnom_Penh
    ports:
      - "8004:8004"
    depends_on:
      trade-redis:
        condition: service_healthy
    networks:
      - gdce-network
    restart: unless-stopped

  dal-metadata-db:
    image: postgres:16-alpine
    container_name: dal-metadata-db
    env_file:
      - ./data/dal/.env
    environment:
      POSTGRES_USER: dal_meta
      POSTGRES_PASSWORD: dal_meta_password
      POSTGRES_DB: dal_metadata
    ports:
      - "5433:5432"
    volumes:
      - dal_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dal-network

  dal-operational-db:
    image: postgres:16-alpine
    container_name: dal-operational-db
    env_file:
      - ./data/dal/.env
    environment:
      POSTGRES_USER: dal_ops
      POSTGRES_PASSWORD: dal_ops_password
      POSTGRES_DB: dal_operational
    ports:
      - "5434:5432"
    volumes:
      - dal_operational_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dal-network

  dal-redis:
    image: redis:7-alpine
    container_name: dal-redis
    ports:
      - "6380:6379"
    volumes:
      - dal_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dal-network

  dal-migrate:
    build:
      context: ./data/dal
    container_name: dal-migrate
    env_file:
      - ./data/dal/.env
    environment:
      METADATA_DB_HOST: dal-metadata-db
      METADATA_DB_PORT: 5432
      OPERATIONAL_DB_HOST: dal-operational-db
      OPERATIONAL_DB_PORT: 5432
      REDIS_HOST: dal-redis
    command: ["alembic", "upgrade", "head"]
    depends_on:
      dal-metadata-db:
        condition: service_healthy
      dal-operational-db:
        condition: service_healthy
      dal-redis:
        condition: service_healthy
    networks:
      - dal-network
    restart: "no"

  dal-metadata-restore:
    image: postgres:16-alpine
    container_name: dal-metadata-restore
    depends_on:
      dal-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dal_meta_password
    volumes:
      - ./local_data/dal_metadata.backup:/dump/dal_metadata.backup:ro
    command:
      - sh
      - -lc
      - >
        pg_restore -h dal-metadata-db -U dal_meta -d dal_metadata --clean --if-exists /dump/dal_metadata.backup
    networks:
      - dal-network
    restart: "no"

  dal-operational-restore:
    image: postgres:16-alpine
    container_name: dal-operational-restore
    depends_on:
      dal-migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dal_ops_password
    volumes:
      - ./local_data/dal_operational.backup:/dump/dal_operational.backup:ro
    command:
      - sh
      - -lc
      - >
        pg_restore -h dal-operational-db -U dal_ops -d dal_operational --clean --if-exists /dump/dal_operational.backup
    networks:
      - dal-network
    restart: "no"

  dal-app:
    build:
      context: ./data/dal
    container_name: dal-app
    env_file:
      - ./data/dal/.env
    environment:
      METADATA_DB_HOST: dal-metadata-db
      METADATA_DB_PORT: 5432
      OPERATIONAL_DB_HOST: dal-operational-db
      OPERATIONAL_DB_PORT: 5432
      REDIS_HOST: dal-redis
    command: ["sh", "scripts/start.sh", "--reload"]
    ports:
      - "8010:8000"
    depends_on:
      dal-metadata-restore:
        condition: service_completed_successfully
      dal-operational-restore:
        condition: service_completed_successfully
      dal-redis:
        condition: service_healthy
    networks:
      dal-network:
      gdce-network:
        aliases:
          - dal-app
    restart: unless-stopped

  orchestrator-service:
    build:
      context: ./services_version2/orchestrator
    container_name: orchestrator-service
    env_file:
      - ./services_version2/orchestrator/.env
    environment:
      ORCHESTRATOR_HOST: 0.0.0.0
      ORCHESTRATOR_PORT: 8001
      RETRIEVAL_SERVICE_URL: http://retrieval:8003
      CALCULATOR_SERVICE_URL: http://calculator:8002
      TRADE_DATA_SERVICE_URL: http://trade-service:8004
      GENERAL_SERVICE_URL: http://general:8005
    ports:
      - "8001:8001"
    depends_on:
      - retrieval
      - calculator
      - trade-service
      - general
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gdce-network
    restart: unless-stopped

networks:
  gdce-network:
    name: gdce-network
  dal-network:

volumes:
  retrieval_qdrant_data:
  general_qdrant_data:
  calculator_postgres18_data:
  dal_metadata_data:
  dal_operational_data:
  dal_redis_data:
